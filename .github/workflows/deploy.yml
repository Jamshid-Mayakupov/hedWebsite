# .github/workflows/deploy.yml
name: Deploy to Server

on:
  push:
    branches:
      - main # Run on push to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        # with:
        #     token: ${{ secrets.MY_GITHUB_TOKEN }}


      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 22.11.0 # Vite requires Node 14.18+ or 16+

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Deploy to server
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}"  scp -o StrictHostKeyChecking=no -P 22022 -r dist/ hed@84.54.116.154:/home/hed/heduz

      - name: Deploying on server
        run: npm run build || npm install && npm run build